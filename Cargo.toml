[package]
name = "qtty-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for qtty physical quantities"
license = "AGPL-3.0"
repository = "https://github.com/Siderust/qtty"
authors = ["VPRamon <vallespuigramon@gmail.com>"]

[lib]
name = "qtty_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
qtty-ffi = { git = "https://github.com/Siderust/qtty.git", tag = "v0.8.6", features = ["pyo3"] }
pyo3 = { version = "0.29" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
approx = "0.5"
