[package]
name = "qtty-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for qtty physical quantities"
license = "AGPL-3.0"
repository = "https://github.com/Siderust/qtty"
authors = ["VPRamon <vallespuigramon@gmail.com>"]

[lib]
name = "qtty"  # Python import name
crate-type = ["cdylib"]

[dependencies]
qtty-ffi = { path = "qtty/qtty-ffi", features = ["pyo3"] }
pyo3 = { version = "0.28.2", features = ["extension-module"] }
serde_json = "1.0"

[dev-dependencies]
pyo3 = { version = "0.28.2", features = ["auto-initialize"] }
approx = "0.5"
