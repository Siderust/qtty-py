[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "qtty"
version = "0.1.0"
description = "Fast, type-safe physical quantities for Python (powered by Rust)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0"}
authors = [
    {name = "VPRamon", email = "vallespuigramon@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["units", "quantities", "physics", "astronomy", "rust"]

[project.urls]
Repository = "https://github.com/Siderust/qtty"
Documentation = "https://docs.rs/qtty"

[tool.maturin]
python-source = "python"
module-name = "qtty._qtty"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
